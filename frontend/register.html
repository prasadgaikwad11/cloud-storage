<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — CloudVault</title>
  <meta name="description" content="Create your free CloudVault account and start storing files in the cloud today." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; }

    .auth-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 80% 50%, rgba(6,182,212,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 20% 30%, rgba(99,102,241,0.1) 0%, transparent 60%);
    }

    .auth-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
      opacity: 0.3;
    }

    .auth-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 480px;
    }

    .auth-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 32px; text-decoration: none;
    }

    .auth-logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }

    .auth-logo-text {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .auth-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 40px 36px;
      box-shadow: var(--shadow-lg); animation: slideUp 0.4s ease;
    }

    .auth-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .auth-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 28px; }

    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }
    .input-wrapper .form-input { padding-left: 44px; }
    .input-wrapper .form-input.has-toggle { padding-right: 44px; }

    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; color: var(--text-muted); padding: 4px;
      border-radius: 4px; transition: color var(--transition-fast); line-height: 1;
    }
    .toggle-password:hover { color: var(--text-primary); }

    /* Password Strength */
    .strength-wrap { margin-top: 8px; }
    #strength-bar {
      height: 4px; border-radius: var(--radius-full);
      background: transparent; transition: all 0.4s ease; width: 0%;
    }
    #strength-label { font-size: 0.75rem; margin-top: 4px; font-weight: 600; }

    /* Confirm hint */
    #confirm-hint { font-size: 0.78rem; margin-top: 4px; font-weight: 600; }

    .perks {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 24px;
    }
    .perk {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .perk-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); flex-shrink: 0;
    }

    .auth-footer {
      text-align: center; margin-top: 20px;
      font-size: 0.88rem; color: var(--text-muted);
    }
    .auth-footer a { color: var(--primary-light); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-grid"></div>

  <div class="auth-wrapper">
    <a href="index.html" class="auth-logo" id="back-to-home">
      <div class="auth-logo-icon">☁️</div>
      <span class="auth-logo-text">CloudVault</span>
    </a>

    <div class="auth-card">
      <h1 class="auth-title">Create your account</h1>
      <p class="auth-subtitle">Get 5 GB free cloud storage — no credit card needed</p>

      <div class="perks">
        <div class="perk"><div class="perk-dot"></div>5 GB free storage</div>
        <div class="perk"><div class="perk-dot"></div>AWS S3 backed</div>
        <div class="perk"><div class="perk-dot"></div>End-to-end secure</div>
        <div class="perk"><div class="perk-dot"></div>No credit card</div>
      </div>

      <form id="register-form" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input class="form-input" type="text" id="name" name="name"
              placeholder="John Doe" autocomplete="name" required />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input class="form-input" type="email" id="email" name="email"
              placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input class="form-input has-toggle" type="password" id="password" name="password"
              placeholder="Min. 6 characters" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="password">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <!-- Strength indicator -->
          <div class="strength-wrap">
            <div class="progress-bar-wrapper">
              <div id="strength-bar"></div>
            </div>
            <span id="strength-label"></span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
            </span>
            <input class="form-input has-toggle" type="password" id="confirm-password"
              name="confirm-password" placeholder="Re-enter your password"
              autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="confirm-password">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <span id="confirm-hint"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-full" id="register-btn"
          style="justify-content:center;margin-top:4px">
          <span id="register-btn-text">Create Account</span>
          <span id="register-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" id="go-login">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
