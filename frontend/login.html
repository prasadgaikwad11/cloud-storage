<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — CloudVault</title>
  <meta name="description" content="Sign in to your CloudVault account to access your cloud files." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .auth-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(6,182,212,0.08) 0%, transparent 60%);
    }

    .auth-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px),
                        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
      opacity: 0.3;
    }

    .auth-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      padding: 24px 16px;
    }

    .auth-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 36px;
      text-decoration: none;
    }

    .auth-logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }

    .auth-logo-text {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.4s ease;
    }

    .auth-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; }
    .auth-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 32px; }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .input-wrapper .form-input { padding-left: 44px; }

    .toggle-password {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; color: var(--text-muted); padding: 4px;
      border-radius: 4px; transition: color var(--transition-fast);
      line-height: 1;
    }
    .toggle-password:hover { color: var(--text-primary); }
    .input-wrapper .form-input.has-toggle { padding-right: 44px; }

    .forgot-link {
      font-size: 0.82rem; color: var(--text-muted);
      transition: color var(--transition-fast);
    }
    .forgot-link:hover { color: var(--primary-light); }

    .auth-footer {
      text-align: center; margin-top: 24px;
      font-size: 0.88rem; color: var(--text-muted);
    }

    .auth-footer a { color: var(--primary-light); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    @media (max-width: 480px) {
      .auth-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="auth-bg"></div>
  <div class="auth-grid"></div>

  <div class="auth-wrapper">
    <!-- Logo -->
    <a href="index.html" class="auth-logo" id="back-to-home">
      <div class="auth-logo-icon">☁️</div>
      <span class="auth-logo-text">CloudVault</span>
    </a>

    <!-- Card -->
    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to access your cloud storage</p>

      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
            </span>
            <input class="form-input" type="email" id="email" name="email"
              placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <label class="form-label" for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input class="form-input has-toggle" type="password" id="password" name="password"
              placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-password" data-target="password" id="toggle-pw-btn">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary w-full" id="login-btn"
          style="justify-content:center;margin-top:8px">
          <span id="login-btn-text">Sign In</span>
          <span id="login-spinner" class="spinner hidden"></span>
        </button>
      </form>

      <div class="divider">or</div>

      <div class="auth-footer">
        Don't have an account?
        <a href="register.html" id="go-register">Create one free</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="js/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
